# drop_aligner 参数
align_mode_topic: /uav_vision/align_mode
default_mode: disabled
# 真实链路从 CameraInfo 主点取对准参考；无 CameraInfo 的 mock 回退以下参数
camera_info_topic: /camera/camera_info
use_camera_info: true
target_center_x: 640.0
target_center_y: 480.0
max_offset_px: 30.0
stable_frames: 3
min_confidence: 0.6
target_max_age: 0.5

# Explicit opt-in for slot compensation. Controller owns the compensated FC goal;
# drop_circle/drop_cross use its feedback instead of requiring pixel centering.
# This also requires a valid AlignmentTargetContext, regardless of the switch below.
require_compensated_alignment: false
drop_alignment_feedback_topic: /uav_vision/drop_alignment_feedback
compensated_feedback_max_age: 0.5
compensated_odom_max_age: 0.5
# Cover the existing 0.5s observation window at 30Hz, including the newest frame.
compensated_observation_cache_size: 16
